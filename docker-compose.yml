# Docker Compose file to start a global Traefik container for multiple projects
# The Docker network subnet and Traefik container IP are fixed to enable ISP router NAT port forwarding
#
# Create the .env file before starting (see env.example)
# Before the first launch, initialize the host folders for Docker volumes with init-voldir.sh
# Edit traefik.toml in the host volume folder
# Then run: docker compose up -d
# Traefik listens on ports 80, 443, 9000 (see zmevents in the Zoneminder project), and 9080 (Traefik dashboard, if enabled in traefik.toml)
#
#    Copyright (C) 2026 - D4void
#    Licensed under the MIT License. See LICENSE file in the project root for details.
#
# 2024/09/19
#   Changed Traefik restart policy to "always" (restart bug workaround)
#   https://github.com/traefik/traefik/issues/5833
# 2026/08/08
#   Added deploy.restart_policy: dockerd (live-restore) can leave the container
#   "Exited" after a docker engine update, and plain "restart: always" alone
#   does not bring it back up in that case (see same issue, comments from Jul 2024)

services:

  traefik:
    restart: "always"
    image: "traefik:${TRAEFIK_TAG}"
    container_name: "MyTraefik"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    ports:
      - "${HOST_IP}:80:80"
      - "${HOST_IP}:443:443"
      - "${HOST_IP}:9000:9000"
      - "${HOST_IP}:9080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_conf:/etc/traefik:ro
      - traefik_log:/log
      - traefik_letsencrypt_data:/letsencrypt
    networks:
      default:
        ipv4_address: ${TRAEFIK_IP}

volumes:
  traefik_conf:
    driver: local
    driver_opts:
      type: none
      device: ${TRAEFIK_VOL}/etc/traefik
      o: bind
  traefik_log:
    driver: local
    driver_opts:
      type: none
      device: ${TRAEFIK_VOL}/log
      o: bind
  traefik_letsencrypt_data:
    driver: local
    driver_opts:
      type: none
      device: ${TRAEFIK_LETSENCRYPT_VOL}
      o: bind

networks:
  default:
    name: MyTraefikNet
    driver: bridge
    attachable: true
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}
